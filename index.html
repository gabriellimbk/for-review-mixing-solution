<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixing of solutions</title>

    <style>
        :root{
            --bg:#ffffff;
            --ink:#000000;
            --muted:#333333;

            --border:#cccccc;
            --border-strong:#000000;

            --panel:#ffffff;

            --sectionW: 760px;
        }

        *{ box-sizing:border-box; font-family: Arial, sans-serif; }
        body {
            margin: 20px;
            background: var(--bg);
            color: var(--ink);
            min-height: 100dvh;
        }

        .container {
            background: var(--panel);
            max-width: var(--sectionW);
            margin: 0 auto;
            border: 1px solid var(--border);
            padding: 15px;
        }

        .top-header{
            margin: 0 0 12px;
            padding: 0 0 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: bold;
            color: var(--ink);
            line-height: 1.1;
        }

        /* ✅ Subtitle + instruction: same font size; instruction italic */
        .subtitle,
        .subtitle-instruction{
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 14px;   /* same size for both lines */
            line-height: 1.2;
        }
        .subtitle-instruction{
            font-style: italic;
        }

        .main-section {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            justify-content: flex-start;
            margin: 12px 0 10px;
            flex-wrap: wrap;
        }
        .main-section.hidden { display:none; }

        .beaker-group {
            width: 340px;
            border: none;
            padding: 0;
            background: transparent;
        }

        .beaker-display {
            text-align: center;
            margin-bottom: 10px;
            position: relative;
        }

        .beaker-visual {
            width: 135px;
            height: 165px;
            margin: 0 auto 6px;
            position: relative;
            border: 4px solid var(--border-strong);
            border-top: none;
            border-radius: 0 0 50px 50px;
            transition: all 0.5s ease;
            background: linear-gradient(to bottom, transparent 100%);
        }

        .beaker-content,
        .beaker-content-anim {
            position: static;
            transform: none;
            margin: 4px auto 0;
            display: inline-block;
            min-width: 160px;
            padding: 4px 8px;
            font-size: 12px;
            line-height: 1.2;
            text-align: center;
            word-wrap: break-word;
            color: #000;
            border: 1px solid var(--border);
            background: #f5f5f5;
        }

        .radio-section {
            background: #fff;
            padding: 6px;
            border: 1px solid var(--border);
        }
        .radio-section.hidden { display:none; }

        .radio-option {
            display: flex;
            align-items: center;
            margin: 4px 0;
            padding: 6px 8px;
            background: #fff;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .radio-option:hover { background: #f3f3f3; }

        .radio-option input[type="radio"]:checked + label { font-weight: bold; }

        .radio-option.selected {
            border: 1px solid var(--border-strong);
            background: #f3f3f3;
        }

        input[type="radio"] { margin-right: 8px; transform: scale(1.0); }
        label { cursor: pointer; flex: 1; }

        .solution-info { font-size: 12px; color: #000; margin-left: 0; }
        .solution-line { display:block; line-height: 1.15; }

        .ksp-display {
            margin: 12px 0 10px;
            padding: 0;
            text-align: left;
            background: transparent;
            font-weight: normal;
            color: #000;
            display: none;
            font-size: 14px;
            border: none;
        }

        .ppt-question {
            margin: 6px 0 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .answer-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .answer-btn {
            padding: 6px 16px;
            font-size: 14px;
            border: 1px solid var(--border-strong);
            cursor: pointer;
            font-weight: bold;
            background: #fff;
            color: #000;
        }

        .answer-yes {
            background: #d9f7d9; /* pastel green */
        }

        .answer-yes:hover { background: #c9f0c9; }

        .answer-no {
            background: #f8d7da; /* pastel red */
        }

        .answer-no:hover { background: #f3c7cb; }

        button {
            padding: 6px 14px;
            font-size: 14px;
            border: 1px solid var(--border);
            cursor: pointer;
            background: #fff;
            color: #000;
            font-weight: bold;
        }
        button:hover { background: #f3f3f3; }

        #resetBtn {
            border: 1px solid var(--border-strong);
            background: #ffffff;
        }
        #resetBtn:hover { background: #f3f3f3; }

        #results {
            margin-top: 10px;
            padding: 12px;
            background: #fff;
            border: 1px solid var(--border);
            min-height: 130px;
        }

        #resultSummary{ margin-top: 6px; }

        .result-feedback {
            font-weight: bold;
            margin-top: 6px;
        }

        .result-feedback.correct { color: #007a2f; }
        .result-feedback.incorrect { color: #b00020; }

        .toggle-calc-btn{
            margin-top: 8px;
            padding: 6px 10px;
            font-size: 12px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        .toggle-calc-btn:hover{ background:#f3f3f3; }

        .calculation-display {
            background: #fff;
            padding: 10px;
            border: 1px solid var(--border);
            font-size: 14px;
            margin: 10px 0 0;
        }

        .calculation-line {
            margin: 10px 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 0 4px;
            vertical-align: middle;
        }

        .fraction .numerator {
            padding: 2px 4px;
            border-bottom: 2px solid #000;
            background:#fff;
        }

        .fraction .denominator { padding: 2px 4px; background:#fff; }

        .highlight-yellow {
            background: #fff2a8;
            padding: 1px 3px;
            font-weight: bold;
        }

        .highlight-purple {
            background: #cfefff;
            padding: 1px 3px;
            font-weight: bold;
        }

        .ip-result {
            margin-top: 10px;
            padding: 8px;
            text-align: left;
            font-weight: bold;
            border: 1px solid var(--border);
            background: #fff;
        }

        .precipitate-yes { color: #b00020; border-color: #b00020; }
        .precipitate-no { color: #007a2f; border-color: #007a2f; }

        .flashcard {
            border: 1px solid var(--border);
            background: #fff;
            margin-top: 10px;
            padding: 10px;
            cursor: pointer;
        }

        .flashcard-title {
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .flashcard-reveal {
            font-weight: normal;
            margin-left: auto;
            text-align: right;
        }

        .flashcard-body {
            display: none;
            margin-top: 8px;
        }

        .flashcard.open .flashcard-body {
            display: block;
        }

        /* (kept for any use elsewhere; not used in header now) */
        .info-note { color: #000; font-style: italic; margin: 0; }

        sup, sub { font-size: 0.75em; }

        .animation-container {
            display: none;
            padding: 14px 0 6px;
            position: relative;
            min-height: 280px;
            overflow: visible;
        }
        .animation-container.active { display: block; }

        .beakers-pouring-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 200px;
            position: relative;
            height: 220px;
        }

        .pouring-wrapper {
            position: relative;
            flex: 0 0 135px;
            text-align: center;
        }

        .pouring-beaker {
            width: 135px;
            height: 165px;
            position: relative;
            border: 4px solid var(--border-strong);
            border-top: none;
            border-radius: 0 0 50px 50px;
            transition: all 0.5s ease;
            background: linear-gradient(to bottom, transparent 100%);
            margin: 0 auto;
        }

        .pouring-beaker.left {
            transform-origin: bottom center;
            animation: pourLeft 2.5s ease-in-out forwards;
        }

        .pouring-beaker.right {
            transform-origin: bottom center;
            animation: pourRight 2.5s ease-in-out forwards;
        }

        @keyframes pourLeft {
            0%, 30% { transform: rotate(0deg) translateY(0); }
            50%, 70% { transform: rotate(18deg) translateY(-10px); }
            100% { transform: rotate(0deg) translateY(0); }
        }

        @keyframes pourRight {
            0%, 30% { transform: rotate(0deg) translateY(0); }
            50%, 70% { transform: rotate(-18deg) translateY(-10px); }
            100% { transform: rotate(0deg) translateY(0); }
        }

        .combined-beaker-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 30px;
            z-index: 10;
            text-align:center;
        }

        .combined-beaker {
            width: 150px;
            height: 180px;
            margin: 0 auto;
            position: relative;
            border: 4px solid var(--border-strong);
            border-top: none;
            border-radius: 0 0 60px 60px;
            background: linear-gradient(to bottom, transparent 100%);
        }

        .combined-volume{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            font-weight:bold;
            font-size:14px;
            padding:2px 8px;
            background:#fff;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .combined-beaker.filling { animation: fillBeaker 2.5s ease-in-out forwards; }

        @keyframes fillBeaker {
            0%, 40% { background: linear-gradient(to bottom, transparent 100%); }
            70%, 100% { background: linear-gradient(to bottom, transparent 60%, #f0f0f0 60%); }
        }

        .precipitate {
            position: absolute;
            bottom: 3px;
            left: 15%;
            right: 15%;
            height: 0;
            background: #ffffff;
            border: 2px solid var(--border-strong);
            border-radius: 50%;
            opacity: 0;
            transition: all 1s ease-in;
        }

        .precipitate.show {
            animation: formPrecipitate 1s ease-in forwards;
            animation-delay: 2.5s;
        }

        @keyframes formPrecipitate {
            from { opacity: 0; height: 0; }
            to { opacity: 1; height: 25px; }
        }

        .animation-label {
            margin-top: 10px;
            font-weight: bold;
            color: #000;
            font-size: 14px;
        }

        .main-section.animating .beaker-display { display: none; }

        @media (max-width: 768px){
            .main-section{ flex-direction:column; align-items:stretch; }
            .beaker-group{ width: 100%; }
            .beakers-pouring-container{ gap: 80px; }
        }

        @media (max-width: 600px){
            body{ overflow-x:hidden; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top-header">
            <h1>Mixing of Solutions</h1>
            <p class="subtitle">Will a ppt form when the two solutions are mixed?</p>
            <!-- ✅ moved instruction here, same font size, italic -->
            <p class="subtitle-instruction">Select one solution from each group and click the button to see if precipitation occurs</p>
        </div>

        <div class="main-section" id="mainSection">
            <div class="beaker-group">
                <div class="beaker-display">
                    <div class="beaker-visual" id="beaker1-visual"></div>
                    <div class="beaker-content" id="beaker1-content"></div>
                </div>
                <div class="radio-section" id="radioSection1">
                    <div class="radio-option" data-solution="1">
                        <input type="radio" name="group1" id="solution-1" value="1">
                        <label for="solution-1">
                            <span class="solution-info">
                                <span class="solution-line">20 cm³ of Li⁺(aq)</span>
                                <span class="solution-line">1.0 mol dm⁻³</span>
                            </span>
                        </label>
                    </div>
                    <div class="radio-option" data-solution="2">
                        <input type="radio" name="group1" id="solution-2" value="2">
                        <label for="solution-2">
                            <span class="solution-info">
                                <span class="solution-line">50 cm³ of Mg²⁺(aq)</span>
                                <span class="solution-line">0.0010 mol dm⁻³</span>
                            </span>
                        </label>
                    </div>
                    <div class="radio-option" data-solution="3">
                        <input type="radio" name="group1" id="solution-3" value="3">
                        <label for="solution-3">
                            <span class="solution-info">
                                <span class="solution-line">100 cm³ of CaCO₃(aq)</span>
                                <span class="solution-line">1×10⁻⁵ mol dm⁻³</span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="beaker-group">
                <div class="beaker-display">
                    <div class="beaker-visual" id="beaker2-visual"></div>
                    <div class="beaker-content" id="beaker2-content"></div>
                </div>
                <div class="radio-section" id="radioSection2">
                    <div class="radio-option" data-solution="a">
                        <input type="radio" name="group2" id="solution-a" value="a">
                        <label for="solution-a">
                            <span class="solution-info">
                                <span class="solution-line">20 cm³ of F⁻(aq)</span>
                                <span class="solution-line">0.010 mol dm⁻³</span>
                            </span>
                        </label>
                    </div>
                    <div class="radio-option" data-solution="b">
                        <input type="radio" name="group2" id="solution-b" value="b">
                        <label for="solution-b">
                            <span class="solution-info">
                                <span class="solution-line">50 cm³ of CO₃²⁻(aq)</span>
                                <span class="solution-line">0.0010 mol dm⁻³</span>
                            </span>
                        </label>
                    </div>
                    <div class="radio-option" data-solution="c">
                        <input type="radio" name="group2" id="solution-c" value="c">
                        <label for="solution-c">
                            <span class="solution-info">
                                <span class="solution-line">100 cm³ of Mg₃(PO₄)₂(aq)</span>
                                <span class="solution-line">5×10⁻⁵ mol dm⁻³</span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="animation-container" id="animationContainer">
            <div class="beakers-pouring-container">
                <div class="pouring-wrapper">
                    <div class="pouring-beaker left" id="leftBeaker"></div>
                    <div class="beaker-content-anim" id="leftBeakerContent"></div>
                </div>
                <div class="combined-beaker-container">
                    <div class="combined-beaker" id="combinedBeaker">
                        <div class="combined-volume" id="combinedVolumeLabel"></div>
                        <div class="precipitate" id="precipitate"></div>
                    </div>
                    <div class="animation-label">Mixed Solution</div>
                </div>
                <div class="pouring-wrapper">
                    <div class="pouring-beaker right" id="rightBeaker"></div>
                    <div class="beaker-content-anim" id="rightBeakerContent"></div>
                </div>
            </div>
        </div>

        <div id="kspDisplay" class="ksp-display"></div>
        <div id="pptQuestion" class="ppt-question" style="display:none;">Will a ppt form after mixing?</div>
        <div class="answer-buttons" id="answerButtons" style="display:none;">
            <button id="answerYes" class="answer-btn answer-yes">Yes</button>
            <button id="answerNo" class="answer-btn answer-no">No</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div id="results">
            <!-- ✅ instruction removed from results area -->
            <p class="info-note" id="resultsInfo" style="display:none;"></p>
            <div id="resultSummary"></div>
            <button id="toggleCalcBtn" class="toggle-calc-btn" style="display:none;">
                Show calculation steps
            </button>
            <div id="calcSection" style="display:none;"></div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const solutions = {
            "1": { ionLabel: "Li⁺",       volumeCm3: 20,  volumeDm3: 0.020, volumeStr: "0.020", concStr: "1.0",      colorHex: "#FFE066" },
            "2": { ionLabel: "Mg²⁺",      volumeCm3: 50,  volumeDm3: 0.050, volumeStr: "0.050", concStr: "0.0010",   colorHex: "#FFE066" },
            "3": { ionLabel: "CaCO₃",     volumeCm3: 100, volumeDm3: 0.100, volumeStr: "0.100", concStr: "1 × 10⁻⁵", colorHex: "#FFE066" },
            "a": { ionLabel: "F⁻",        volumeCm3: 20,  volumeDm3: 0.020, volumeStr: "0.020", concStr: "0.010",    colorHex: "#7DD3FC" },
            "b": { ionLabel: "CO₃²⁻",     volumeCm3: 50,  volumeDm3: 0.050, volumeStr: "0.050", concStr: "0.0010",   colorHex: "#7DD3FC" },
            "c": { ionLabel: "Mg₃(PO₄)₂", volumeCm3: 100, volumeDm3: 0.100, volumeStr: "0.100", concStr: "5 × 10⁻⁵", colorHex: "#7DD3FC" }
        };

        const speciesContributions = {
            "1": { Li: { conc: 1.0,    concStr: "1.0" } },
            "2": { Mg: { conc: 0.0010, concStr: "0.0010" } },
            "3": {
                Ca:  { conc: 1e-5,   concStr: "1 × 10⁻⁵" },
                CO3: { conc: 1e-5,   concStr: "1 × 10⁻⁵" }
            },
            "a": { F:   { conc: 0.010,   concStr: "0.010" } },
            "b": { CO3: { conc: 0.0010,  concStr: "0.0010" } },
            "c": {
                Mg:  { conc: 0.00015, concStr: "0.00015" },
                PO4: { conc: 0.00010, concStr: "0.00010" }
            }
        };

        const combinations = {
            "1-a": { cationId: "Li",  cationLabel: "Li⁺", anionId: "F",   anionLabel: "F⁻",     pCat: 1, pAn: 1, ksp: 3.8e-3,  kspText: "Kₛₚ value of LiF = 3.8 × 10⁻³" },
            "1-b": { cationId: "Li",  cationLabel: "Li⁺", anionId: "CO3", anionLabel: "CO₃²⁻",  pCat: 2, pAn: 1, ksp: 2.5e-2,  kspText: "Kₛₚ value of Li₂CO₃ = 2.5 × 10⁻²" },
            "1-c": { cationId: "Li",  cationLabel: "Li⁺", anionId: "PO4", anionLabel: "PO₄³⁻",  pCat: 3, pAn: 1, ksp: 3.2e-9,  kspText: "Kₛₚ value of Li₃PO₄ = 3.2 × 10⁻⁹" },
            "2-a": { cationId: "Mg",  cationLabel: "Mg²⁺", anionId: "F",   anionLabel: "F⁻",     pCat: 1, pAn: 2, ksp: 3.7e-8,  kspText: "Kₛₚ value of MgF₂ = 3.7 × 10⁻⁸" },
            "2-b": { cationId: "Mg",  cationLabel: "Mg²⁺", anionId: "CO3", anionLabel: "CO₃²⁻",  pCat: 1, pAn: 1, ksp: 3.5e-8,  kspText: "Kₛₚ value of MgCO₃ = 3.5 × 10⁻⁸" },
            "2-c": { cationId: "Mg",  cationLabel: "Mg²⁺", anionId: "PO4", anionLabel: "PO₄³⁻",  pCat: 3, pAn: 2, ksp: 1e-25,   kspText: "Kₛₚ value of Mg₃(PO₄)₂ = 1 × 10⁻²⁵" },
            "3-a": { cationId: "Ca",  cationLabel: "Ca²⁺", anionId: "F",   anionLabel: "F⁻",     pCat: 1, pAn: 2, ksp: 5.3e-9,  kspText: "Kₛₚ value of CaF₂ = 5.3 × 10⁻⁹" },
            "3-b": { cationId: "Ca",  cationLabel: "Ca²⁺", anionId: "CO3", anionLabel: "CO₃²⁻",  pCat: 1, pAn: 1, ksp: 2.8e-9,  kspText: "Kₛₚ value of CaCO₃ = 2.8 × 10⁻⁹" },
            "3-c": { cationId: "Ca",  cationLabel: "Ca²⁺", anionId: "PO4", anionLabel: "PO₄³⁻",  pCat: 3, pAn: 2, ksp: 2e-29,   kspText: "Kₛₚ value of Ca₃(PO₄)₂ = 2 × 10⁻²⁹" }
        };

        const KSP_MGCO3 = 3.5e-8;
        let animationInProgress = false;

        const resultsInfo    = document.getElementById("resultsInfo");
        const resultSummary  = document.getElementById("resultSummary");
        const calcSection    = document.getElementById("calcSection");
        const toggleCalcBtn  = document.getElementById("toggleCalcBtn");
        const pptQuestion    = document.getElementById("pptQuestion");
        const answerButtons  = document.getElementById("answerButtons");

        function toSuperscript(exponent) {
            const map = {
                '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹',
                '-': '⁻', '+': '⁺'
            };
            const expStr = exponent.toString();
            return expStr.split("").map(ch => map[ch] || ch).join("");
        }

        function formatNumber(num, precision) {
            if (precision === undefined) precision = 3;
            const abs = Math.abs(num);
            if (abs === 0) return "0";

            if (abs < 1e-4 || abs > 1e4) {
                const expStr = num.toExponential(precision);
                const parts = expStr.split('e');
                const mantissa = parseFloat(parts[0]).toPrecision(precision);
                const exponent = parseInt(parts[1], 10);
                return mantissa + " × 10" + toSuperscript(exponent);
            }

            const s = num.toPrecision(precision);
            return parseFloat(s).toString();
        }

        function buildNumeratorHTML(c1, v1Str, c2, v2Str) {
            let html = "";
            if (c1) {
                html += '<span class="highlight-yellow">(' + c1.concStr + ')(' + v1Str + ')</span>';
            }
            if (c2) {
                if (html) html += " + ";
                html += '<span class="highlight-purple">(' + c2.concStr + ')(' + v2Str + ')</span>';
            }
            if (!html) html = "0";
            return html;
        }

        function clearResults() {
            resultSummary.textContent = "";
            resultSummary.className = "";
            calcSection.innerHTML = "";
            calcSection.style.display = "none";
            toggleCalcBtn.style.display = "none";
            toggleCalcBtn.textContent = "Show calculation steps";
            resultsInfo.style.display = "none";
        }

        function updateKspDisplay() {
            const r1 = document.querySelector('input[name="group1"]:checked');
            const r2 = document.querySelector('input[name="group2"]:checked');
            const box = document.getElementById("kspDisplay");
            if (!r1 || !r2) {
                box.style.display = "none";
                box.innerHTML = "";
                pptQuestion.style.display = "none";
                answerButtons.style.display = "none";
                return;
            }
            const key = r1.value + "-" + r2.value;
            const combo = combinations[key];
            if (combo) {
                if (key === "3-c") {
                    box.innerHTML = combo.kspText +
                        '<br>Kₛₚ value of MgCO₃ = 3.5 × 10⁻⁸';
                } else {
                    box.innerHTML = combo.kspText;
                }
                box.style.display = "block";
                pptQuestion.style.display = "block";
                answerButtons.style.display = "flex";
            } else {
                box.style.display = "none";
                box.innerHTML = "";
                pptQuestion.style.display = "none";
                answerButtons.style.display = "none";
            }
        }

        function setCellAppearance(cell, sol) {
            if (!cell || !sol) return;
            cell.style.backgroundColor = sol.colorHex;
            cell.style.borderColor = 'rgba(0,0,0,0.35)';
            cell.style.color = '#000';
        }

        function updateBeakerVisual(beakerId, sol, contentId) {
            const beaker = document.getElementById(beakerId);
            const label = document.getElementById(contentId);
            const maxVolume = 100;
            const fillFraction = sol.volumeCm3 / maxVolume;
            const cutoff = 100 - fillFraction * 100;

            beaker.style.background = `linear-gradient(to bottom, transparent ${cutoff}%, ${sol.colorHex} ${cutoff}%)`;

            label.innerHTML =
                sol.volumeCm3 + " cm³ of " + sol.ionLabel + "(aq)<br>" +
                sol.concStr + " mol dm⁻³";

            setCellAppearance(label, sol);
        }

        const radios = document.querySelectorAll('input[type="radio"]');
        for (let i = 0; i < radios.length; i++) {
            radios[i].addEventListener("change", function () {
                const group = this.name;
                const value = this.value;
                const sol = solutions[value];

                const sameGroup =
                    document.querySelectorAll('input[name="' + group + '"]');
                for (let j = 0; j < sameGroup.length; j++) {
                    sameGroup[j].closest(".radio-option").classList.remove("selected");
                }
                this.closest(".radio-option").classList.add("selected");

                if (group === "group1") {
                    updateBeakerVisual("beaker1-visual", sol, "beaker1-content");
                } else {
                    updateBeakerVisual("beaker2-visual", sol, "beaker2-content");
                }

                updateKspDisplay();
                clearResults();
            });
        }

        function runAnimation(willPrecipitate, s1, s2) {
            if (animationInProgress) return;
            animationInProgress = true;

            document.getElementById("radioSection1").classList.add("hidden");
            document.getElementById("radioSection2").classList.add("hidden");
            document.getElementById("mainSection").classList.add("animating");
            document.getElementById("animationContainer").classList.add("active");

            const leftBeaker = document.getElementById("leftBeaker");
            const rightBeaker = document.getElementById("rightBeaker");
            const combinedBeaker = document.getElementById("combinedBeaker");
            const combinedVolumeLabel = document.getElementById("combinedVolumeLabel");
            const precipitate = document.getElementById("precipitate");
            const leftCell = document.getElementById("leftBeakerContent");
            const rightCell = document.getElementById("rightBeakerContent");

            const maxVolume = 100;
            const leftFill = 100 - (s1.volumeCm3 / maxVolume) * 100;
            const rightFill = 100 - (s2.volumeCm3 / maxVolume) * 100;

            leftBeaker.style.background =
                `linear-gradient(to bottom, transparent ${leftFill}%, ${s1.colorHex} ${leftFill}%)`;
            rightBeaker.style.background =
                `linear-gradient(to bottom, transparent ${rightFill}%, ${s2.colorHex} ${rightFill}%)`;

            leftCell.innerHTML =
                s1.volumeCm3 + " cm³ of " + s1.ionLabel + "(aq)<br>" +
                s1.concStr + " mol dm⁻³";
            rightCell.innerHTML =
                s2.volumeCm3 + " cm³ of " + s2.ionLabel + "(aq)<br>" +
                s2.concStr + " mol dm⁻³";

            setCellAppearance(leftCell, s1);
            setCellAppearance(rightCell, s2);

            const totalVolume = s1.volumeCm3 + s2.volumeCm3;
            combinedVolumeLabel.textContent = "";

            leftBeaker.classList.remove("left");
            rightBeaker.classList.remove("right");
            combinedBeaker.classList.remove("filling");
            precipitate.classList.remove("show");

            void leftBeaker.offsetWidth;

            leftBeaker.classList.add("left");
            rightBeaker.classList.add("right");
            combinedBeaker.classList.add("filling");

            if (willPrecipitate) precipitate.classList.add("show");

            setTimeout(() => {
                leftBeaker.style.background = "linear-gradient(to bottom, transparent 100%)";
                rightBeaker.style.background = "linear-gradient(to bottom, transparent 100%)";
                combinedVolumeLabel.textContent = totalVolume + " cm³";
            }, 1500);

            setTimeout(() => {
                setTimeout(() => { animationInProgress = false; }, 1000);
            }, 3500);
        }

        function wireFlashcards() {
            const cards = calcSection.querySelectorAll(".flashcard");
            for (let i = 0; i < cards.length; i++) {
                cards[i].addEventListener("click", function () {
                    this.classList.toggle("open");
                });
            }
        }

        function calculate(userThinksPrecipitate) {
            const r1 = document.querySelector('input[name="group1"]:checked');
            const r2 = document.querySelector('input[name="group2"]:checked');

            clearResults();

            if (!r1 || !r2) {
                // keep original behaviour (but message is now in header)
                resultsInfo.innerHTML = 'Please select one solution from each group';
                resultsInfo.style.display = "none";
                return;
            }

            const key = r1.value + "-" + r2.value;
            const combo = combinations[key];
            if (!combo) return;

            const s1 = solutions[r1.value];
            const s2 = solutions[r2.value];
            const totalV = s1.volumeDm3 + s2.volumeDm3;

            function mixedConcentration(speciesId) {
                const c1 = speciesContributions[r1.value] && speciesContributions[r1.value][speciesId];
                const c2 = speciesContributions[r2.value] && speciesContributions[r2.value][speciesId];
                let moles = 0;
                if (c1) moles += c1.conc * s1.volumeDm3;
                if (c2) moles += c2.conc * s2.volumeDm3;
                const conc = moles / totalV;
                return { conc: conc, c1: c1, c2: c2 };
            }

            const cat = mixedConcentration(combo.cationId);
            const an = mixedConcentration(combo.anionId);

            const cCat = cat.conc;
            const cAn = an.conc;

            const ionProduct = Math.pow(cCat, combo.pCat) * Math.pow(cAn, combo.pAn);
            const willPrecipitate = ionProduct > combo.ksp;

            runAnimation(willPrecipitate, s1, s2);

            const isCorrect = userThinksPrecipitate === willPrecipitate;
            let step1Html = "";
            let step2Html = "";

            step1Html += '<div class="calculation-line">';
            step1Html += "[" + combo.cationLabel + "]<sub>on mixing</sub> = ";
            step1Html += '<div class="fraction">' +
                         '<span class="numerator">' +
                         buildNumeratorHTML(cat.c1, s1.volumeStr, cat.c2, s2.volumeStr) +
                         "</span>" +
                         '<span class="denominator">' + s1.volumeStr + " + " + s2.volumeStr + "</span>" +
                         "</div>";
            step1Html += " = " + formatNumber(cCat) + " mol dm⁻³";
            step1Html += "</div>";

            step1Html += '<div class="calculation-line">';
            step1Html += "[" + combo.anionLabel + "]<sub>on mixing</sub> = ";
            step1Html += '<div class="fraction">' +
                         '<span class="numerator">' +
                         buildNumeratorHTML(an.c1, s1.volumeStr, an.c2, s2.volumeStr) +
                         "</span>" +
                         '<span class="denominator">' + s1.volumeStr + " + " + s2.volumeStr + "</span>" +
                         "</div>";
            step1Html += " = " + formatNumber(cAn) + " mol dm⁻³";
            step1Html += "</div>";

            step2Html += '<div class="calculation-line" style="margin-top:18px;">';
            if (key === "3-c") {
                step2Html += "I.P. (for Ca₃(PO₄)₂) = (" + formatNumber(cCat) + ")";
            } else {
                step2Html += "I.P. = (" + formatNumber(cCat) + ")";
            }
            if (combo.pCat > 1) step2Html += toSuperscript(combo.pCat);
            step2Html += "(" + formatNumber(cAn) + ")";
            if (combo.pAn > 1) step2Html += toSuperscript(combo.pAn);
            step2Html += " = " + formatNumber(ionProduct);
            step2Html += "</div>";

            step2Html += '<div class="calculation-line" style="margin-top:10px;">';
            if (key === "3-c") {
                step2Html += "Kₛₚ (for Ca₃(PO₄)₂) = " + formatNumber(combo.ksp);
            } else {
                step2Html += "Kₛₚ = " + formatNumber(combo.ksp);
            }
            step2Html += "</div>";

            let summaryHtml = "";
            if (key === "3-c") {
                summaryHtml = (ionProduct > combo.ksp)
                    ? '<div class="ip-result precipitate-yes">I.P. of Ca₃(PO₄)₂ &gt; Kₛₚ ⇒ ppt forms</div>'
                    : '<div class="ip-result precipitate-no">I.P. of Ca₃(PO₄)₂ &lt; Kₛₚ ⇒ no ppt</div>';
            } else {
                summaryHtml = (ionProduct > combo.ksp)
                    ? '<div class="ip-result precipitate-yes">I.P. &gt; Kₛₚ ⇒ ppt forms</div>'
                    : '<div class="ip-result precipitate-no">I.P. &lt; Kₛₚ ⇒ no ppt</div>';
            }

            step2Html += summaryHtml;

            if (key === "1-a" && !willPrecipitate) {
                step2Html += '<div style="font-style:italic; color:#000; margin-top:10px;">' +
                             '<span style="font-weight:bold;">extension question:</span><br>' +
                             '<span>what is the minimum concentration of the 20 cm³ solution of F⁻(aq) to form a ppt?</span>' +
                             '</div>';
            }
            if (key === "1-b" && !willPrecipitate) {
                step2Html += '<div style="font-style:italic; color:#000; margin-top:10px;">' +
                             '<span style="font-weight:bold;">extension question:</span><br>' +
                             '<span>what is the minimum concentration of the 50 cm³ CO₃²⁻(aq) solution to form a ppt?</span>' +
                             '</div>';
            }
            if (key === "2-a" && !willPrecipitate) {
                step2Html += '<div style="font-style:italic; color:#000; margin-top:10px;">' +
                             '<span style="font-weight:bold;">extension question:</span><br>' +
                             '<span>what is the minimum concentration of the 20 cm³ F⁻(aq) solution to form a ppt?</span>' +
                             '</div>';
            }
            if (key === "3-a" && !willPrecipitate) {
                step2Html += '<div style="font-style:italic; color:#000; margin-top:10px;">' +
                             '<span style="font-weight:bold;">extension question:</span><br>' +
                             '<span>what is the minimum concentration of the 20 cm³ F⁻(aq) solution to form a ppt?</span>' +
                             '</div>';
            }
            if (key === "3-b" && !willPrecipitate) {
                step2Html += '<div style="font-style:italic; color:#000; margin-top:10px;">' +
                             '<span style="font-weight:bold;">extension question:</span><br>' +
                             '<span>what is the minimum concentration of the 50 cm³ CO₃²⁻(aq) solution to form a ppt?</span>' +
                             '</div>';
            }

            if (key === "3-c") {
                const mgCat = mixedConcentration("Mg");
                const co3An = mixedConcentration("CO3");

                const cMg = mgCat.conc;
                const cCO3 = co3An.conc;
                const ipMgCO3 = cMg * cCO3;

                step1Html += '<div class="calculation-line" style="margin-top:18px;">';
                step1Html += "[Mg²⁺]<sub>on mixing</sub> = ";
                step1Html += '<div class="fraction">' +
                             '<span class="numerator">' +
                             buildNumeratorHTML(mgCat.c1, s1.volumeStr, mgCat.c2, s2.volumeStr) +
                             "</span>" +
                             '<span class="denominator">' + s1.volumeStr + " + " + s2.volumeStr + "</span>" +
                             "</div>";
                step1Html += " = " + formatNumber(cMg) + " mol dm⁻³";
                step1Html += "</div>";

                step1Html += '<div class="calculation-line">';
                step1Html += "[CO₃²⁻]<sub>on mixing</sub> = ";
                step1Html += '<div class="fraction">' +
                             '<span class="numerator">' +
                             buildNumeratorHTML(co3An.c1, s1.volumeStr, co3An.c2, s2.volumeStr) +
                             "</span>" +
                             '<span class="denominator">' + s1.volumeStr + " + " + s2.volumeStr + "</span>" +
                             "</div>";
                step1Html += " = " + formatNumber(cCO3) + " mol dm⁻³";
                step1Html += "</div>";

                step2Html += '<div class="calculation-line" style="margin-top:18px;">';
                step2Html += "I.P. (for MgCO₃) = (" + formatNumber(cMg) + ")(" + formatNumber(cCO3) + ")";
                step2Html += " = " + formatNumber(ipMgCO3);
                step2Html += "</div>";

                step2Html += '<div class="calculation-line" style="margin-top:10px;">';
                step2Html += "Kₛₚ (for MgCO₃) = " + formatNumber(KSP_MGCO3);
                step2Html += "</div>";

                step2Html += '<div class="ip-result precipitate-no">I.P. of MgCO₃ &lt; Kₛₚ ⇒ no ppt</div>';
            }

            let calcHtml = "";
            if (isCorrect) {
                calcHtml = '<div class="calculation-display">' + step1Html + step2Html + "</div>";
            } else {
                calcHtml =
                    '<div class="flashcard">' +
                        '<div class="flashcard-title">' +
                            '<span>Step 1: Calculate the concentration of ions on mixing</span>' +
                            '<span class="flashcard-reveal">Click to reveal answer</span>' +
                        '</div>' +
                        '<div class="flashcard-body"><div class="calculation-display">' + step1Html + '</div></div>' +
                    '</div>' +
                    '<div class="flashcard">' +
                        '<div class="flashcard-title">' +
                            '<span>Step 2: Compare I.P. vs Kₛₚ</span>' +
                            '<span class="flashcard-reveal">Click to reveal answer</span>' +
                        '</div>' +
                        '<div class="flashcard-body"><div class="calculation-display">' + step2Html + '</div></div>' +
                    '</div>';
            }

            calcSection.innerHTML = calcHtml;
            calcSection.style.display = "none";

            resultSummary.textContent = isCorrect ? "You are right!" : "Incorrect!";
            resultSummary.className = "result-feedback " + (isCorrect ? "correct" : "incorrect");

            toggleCalcBtn.style.display = "inline-block";

            updateKspDisplay();
            wireFlashcards();
        }
        function resetAll() {
            const radios = document.querySelectorAll('input[type="radio"]');
            for (let i = 0; i < radios.length; i++) radios[i].checked = false;

            const options = document.querySelectorAll(".radio-option");
            for (let j = 0; j < options.length; j++) options[j].classList.remove("selected");

            const b1 = document.getElementById("beaker1-visual");
            const b2 = document.getElementById("beaker2-visual");
            const c1 = document.getElementById("beaker1-content");
            const c2 = document.getElementById("beaker2-content");

            b1.style.background = "linear-gradient(to bottom, transparent 100%)";
            b2.style.background = "linear-gradient(to bottom, transparent 100%)";
            c1.innerHTML = "";
            c2.innerHTML = "";
            c1.style.backgroundColor = "#f5f5f5";
            c2.style.backgroundColor = "#f5f5f5";

            clearResults();

            const box = document.getElementById("kspDisplay");
            box.style.display = "none";
            box.innerHTML = "";

            pptQuestion.style.display = "none";
            answerButtons.style.display = "none";

            document.getElementById("animationContainer").classList.remove("active");
            document.getElementById("mainSection").classList.remove("animating");
            document.getElementById("radioSection1").classList.remove("hidden");
            document.getElementById("radioSection2").classList.remove("hidden");

            const leftBeaker = document.getElementById("leftBeaker");
            const rightBeaker = document.getElementById("rightBeaker");
            const combinedBeaker = document.getElementById("combinedBeaker");
            const precipitate = document.getElementById("precipitate");
            const leftCell = document.getElementById("leftBeakerContent");
            const rightCell = document.getElementById("rightBeakerContent");
            const combinedVolumeLabel = document.getElementById("combinedVolumeLabel");

            leftBeaker.classList.remove("left");
            rightBeaker.classList.remove("right");
            combinedBeaker.classList.remove("filling");
            precipitate.classList.remove("show");

            leftBeaker.style.background = "linear-gradient(to bottom, transparent 100%)";
            rightBeaker.style.background = "linear-gradient(to bottom, transparent 100%)";
            combinedBeaker.style.background = "linear-gradient(to bottom, transparent 100%)";
            leftCell.innerHTML = "";
            rightCell.innerHTML = "";
            leftCell.style.backgroundColor = "#f5f5f5";
            rightCell.style.backgroundColor = "#f5f5f5";
            combinedVolumeLabel.textContent = "";

            animationInProgress = false;
        }

        toggleCalcBtn.addEventListener("click", function(){
            if (calcSection.style.display === "none" || calcSection.style.display === "") {
                calcSection.style.display = "block";
                toggleCalcBtn.textContent = "Hide calculation steps";
            } else {
                calcSection.style.display = "none";
                toggleCalcBtn.textContent = "Show calculation steps";
            }
        });

        document.getElementById("answerYes").addEventListener("click", function () {
            calculate(true);
        });
        document.getElementById("answerNo").addEventListener("click", function () {
            calculate(false);
        });
        document.getElementById("resetBtn").addEventListener("click", resetAll);

        // ensure initial Ksp display hidden as before
    });
    </script>
</body>
